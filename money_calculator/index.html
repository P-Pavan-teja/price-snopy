<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cash Counter</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --text: #1a1d23;
    --muted: #6b7280;
    --border: #e2e4e9;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --total-bg: #ecfdf5;
    --total-text: #065f46;
    --section-total-bg: #f4f5f7;
    --warn-bg: #fffbeb;
    --warn-text: #92400e;
    --warn-border: #fde68a;
    --ok-bg: #eff6ff;
    --ok-text: #1e40af;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .card h2 { font-size: 16px; margin: 0 0 12px; }
  .card .section-hint { color: var(--muted); font-size: 12px; margin: -8px 0 12px; }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    font-weight: 600;
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
  }
  th.num, td.num { text-align: right; }
  td { padding: 8px 6px; border-bottom: 1px solid var(--border); font-size: 15px; }
  tr:last-child td { border-bottom: none; }
  .denom-label { font-weight: 600; white-space: nowrap; }
  .denom-sub { font-weight: 400; font-size: 11px; color: var(--muted); white-space: nowrap; }
  input[type="number"] {
    width: 64px;
    padding: 8px 6px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 8px;
    text-align: right;
    background: #fafafa;
  }
  input[type="number"]:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
  }
  .subtotal { color: var(--muted); min-width: 60px; display: inline-block; white-space: nowrap; }
  .section-total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--section-total-bg);
    border-radius: 10px;
    padding: 10px 14px;
    margin-top: 12px;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
  }
  .total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--total-bg);
    color: var(--total-text);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 18px;
    font-weight: 700;
  }
  #sections {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
    align-items: start;
    margin-bottom: 20px;
  }
  #sections .card { margin-bottom: 0; }
  .section-toggles {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    font-size: 14px;
  }
  .section-toggles label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
  .tab-btn {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    padding: 10px 4px;
    margin-right: 20px;
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  button {
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-secondary { background: #fff; color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover:not(:disabled) { background: #f2f3f5; }
  .history-item {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .history-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .history-total { font-weight: 700; color: var(--total-text); }
  .history-time { color: var(--muted); font-size: 13px; }
  .history-breakdown {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
    font-size: 13px;
    color: var(--muted);
  }
  .history-breakdown .breakdown-section-title {
    font-weight: 700;
    color: var(--text);
    margin-top: 8px;
  }
  .history-breakdown .breakdown-section-title:first-child { margin-top: 0; }
  .history-breakdown div.breakdown-row { display: flex; justify-content: space-between; padding: 2px 0; }
  .empty-state { color: var(--muted); font-size: 14px; text-align: center; padding: 20px 0; }

  .db-status {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    margin-bottom: 20px;
  }
  .db-status.disconnected { background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--warn-border); }
  .db-status.connected { background: var(--ok-bg); color: var(--ok-text); }
  .db-status .db-label { font-weight: 600; }
  .db-status .db-file { font-weight: 400; opacity: 0.85; }
  .db-status .db-actions { display: flex; gap: 8px; }
  .db-status button { padding: 7px 12px; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Cash Counter</h1>
  <p class="subtitle">Enter how many of each note, coin, and coin roll you have.</p>

  <div id="db-status" class="db-status disconnected">
    <div>
      <div class="db-label">Database: <span id="db-file-name">not connected</span></div>
      <div class="db-file" id="db-status-detail">Connect a .sqlite file to save history to disk.</div>
    </div>
    <div class="db-actions" id="db-connect-actions">
      <button class="btn-primary" id="connect-new-btn">Create New Database File</button>
      <button class="btn-secondary" id="connect-existing-btn">Open Existing File</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-calculator-btn" data-tab="calculator">Calculator</button>
    <button class="tab-btn" id="tab-history-btn" data-tab="history">History</button>
  </div>

  <div id="calculator-panel">
    <div class="section-toggles" id="section-toggles"></div>
    <div id="sections"></div>

    <div class="card">
      <div class="total-row">
        <span>Grand Total</span>
        <span id="grand-total">$0.00</span>
      </div>
      <div class="actions">
        <button class="btn-primary" id="save-btn">Save to History</button>
        <button class="btn-secondary" id="reset-btn">Reset</button>
      </div>
    </div>
  </div>

  <div id="history-panel" hidden>
    <div class="card">
      <h2>History</h2>
      <p class="section-hint">Permanent record — entries can't be deleted from here.</p>
      <div id="history-list"></div>
    </div>
  </div>
</div>

<script src="vendor/sql-wasm.js"></script>
<script src="vendor/sql-wasm-binary.js"></script>
<script>
  // All money handled in integer cents to avoid floating-point rounding issues.
  const SECTIONS = [
    {
      key: 'notes',
      title: 'Notes',
      items: [
        { label: '$100', cents: 10000 },
        { label: '$50',  cents: 5000  },
        { label: '$20',  cents: 2000  },
        { label: '$10',  cents: 1000  },
        { label: '$5',   cents: 500   },
        { label: '$2',   cents: 200   },
        { label: '$1',   cents: 100   },
      ],
    },
    {
      key: 'coins',
      title: 'Coins',
      hint: 'Loose coins, counted individually.',
      items: [
        { label: '$1',   cents: 100 },
        { label: '50¢',  cents: 50  },
        { label: '25¢',  cents: 25  },
        { label: '10¢',  cents: 10  },
        { label: '5¢',   cents: 5   },
        { label: '1¢',   cents: 1   },
      ],
    },
    {
      key: 'rolls',
      title: 'Rolled Coins',
      hint: 'Count = number of full rolls. Standard US roll values used.',
      items: [
        { label: '$1 roll',  sub: '25 coins', cents: 2500 },
        { label: '50¢ roll', sub: '20 coins', cents: 1000 },
        { label: '25¢ roll', sub: '40 coins', cents: 1000 },
        { label: '10¢ roll', sub: '50 coins', cents: 500  },
        { label: '5¢ roll',  sub: '40 coins', cents: 200  },
        { label: '1¢ roll',  sub: '50 coins', cents: 50   },
      ],
    },
  ];

  const HANDLE_DB_NAME = 'cashCounterHandles';
  const HANDLE_STORE = 'handles';
  const HANDLE_KEY = 'dbFileHandle';

  const sectionsEl = document.getElementById('sections');
  const sectionTogglesEl = document.getElementById('section-toggles');
  const grandTotalEl = document.getElementById('grand-total');
  const historyListEl = document.getElementById('history-list');
  const dbStatusEl = document.getElementById('db-status');
  const dbFileNameEl = document.getElementById('db-file-name');
  const dbStatusDetailEl = document.getElementById('db-status-detail');
  const dbConnectActionsEl = document.getElementById('db-connect-actions');
  const connectNewBtn = document.getElementById('connect-new-btn');
  const connectExistingBtn = document.getElementById('connect-existing-btn');
  const saveBtn = document.getElementById('save-btn');

  let SQL = null;
  let db = null;
  let fileHandle = null;
  const fsApiSupported = typeof window.showSaveFilePicker === 'function';

  function formatCents(cents) {
    return '$' + (cents / 100).toFixed(2);
  }

  // ---------- UI: denomination sections ----------

  function buildSections() {
    SECTIONS.forEach((section) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.sectionCard = section.key;

      const rows = section.items.map((item, i) => `
        <tr>
          <td class="denom-label">${item.label}${item.sub ? `<div class="denom-sub">${item.sub}</div>` : ''}</td>
          <td class="num">
            <input type="number" min="0" step="1" value="0"
              data-section="${section.key}" data-index="${i}"
              class="count-input" inputmode="numeric">
          </td>
          <td class="num"><span class="subtotal" data-subtotal="${section.key}-${i}">$0.00</span></td>
        </tr>
      `).join('');

      card.innerHTML = `
        <h2>${section.title}</h2>
        ${section.hint ? `<p class="section-hint">${section.hint}</p>` : ''}
        <table>
          <thead>
            <tr>
              <th>Item</th>
              <th class="num">Count</th>
              <th class="num">Subtotal</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
        <div class="section-total-row">
          <span>${section.title} Total</span>
          <span data-section-total="${section.key}">$0.00</span>
        </div>
      `;

      sectionsEl.appendChild(card);
    });
  }

  function buildSectionToggles() {
    SECTIONS.forEach((section) => {
      const label = document.createElement('label');
      label.innerHTML = `
        <input type="checkbox" checked data-toggle-section="${section.key}">
        ${section.title}
      `;
      sectionTogglesEl.appendChild(label);
    });
  }

  function applySectionVisibility() {
    document.querySelectorAll('[data-toggle-section]').forEach((checkbox) => {
      const key = checkbox.getAttribute('data-toggle-section');
      const card = document.querySelector(`[data-section-card="${key}"]`);
      const included = checkbox.checked;
      card.hidden = !included;
      if (!included) {
        card.querySelectorAll('.count-input').forEach(input => input.value = 0);
      }
    });
    recompute();
  }

  function recompute() {
    let grandCents = 0;

    SECTIONS.forEach((section) => {
      let sectionCents = 0;
      section.items.forEach((item, i) => {
        const input = document.querySelector(`[data-section="${section.key}"][data-index="${i}"]`);
        const v = parseInt(input.value, 10);
        const count = Number.isFinite(v) && v > 0 ? v : 0;
        const subCents = count * item.cents;
        sectionCents += subCents;
        document.querySelector(`[data-subtotal="${section.key}-${i}"]`).textContent = formatCents(subCents);
      });
      document.querySelector(`[data-section-total="${section.key}"]`).textContent = formatCents(sectionCents);
      grandCents += sectionCents;
    });

    grandTotalEl.textContent = formatCents(grandCents);
    return grandCents;
  }

  function getEntryItems() {
    const items = [];
    SECTIONS.forEach((section) => {
      section.items.forEach((item, i) => {
        const input = document.querySelector(`[data-section="${section.key}"][data-index="${i}"]`);
        const v = parseInt(input.value, 10);
        const count = Number.isFinite(v) && v > 0 ? v : 0;
        if (count > 0) {
          items.push({ section: section.title, label: item.label, cents: item.cents, count });
        }
      });
    });
    return items;
  }

  function resetInputs() {
    document.querySelectorAll('.count-input').forEach(input => input.value = 0);
    recompute();
  }

  // ---------- IndexedDB: persist the FileSystemFileHandle across reloads ----------

  function openHandleStore() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(HANDLE_DB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(HANDLE_STORE);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function storeHandle(handle) {
    const idb = await openHandleStore();
    return new Promise((resolve, reject) => {
      const tx = idb.transaction(HANDLE_STORE, 'readwrite');
      tx.objectStore(HANDLE_STORE).put(handle, HANDLE_KEY);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function loadStoredHandle() {
    const idb = await openHandleStore();
    return new Promise((resolve, reject) => {
      const tx = idb.transaction(HANDLE_STORE, 'readonly');
      const req = tx.objectStore(HANDLE_STORE).get(HANDLE_KEY);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }

  // ---------- sql.js: schema + queries ----------

  const SCHEMA = `
    CREATE TABLE IF NOT EXISTS entries (
      id INTEGER PRIMARY KEY AUTOINCREMENT,
      timestamp INTEGER NOT NULL,
      total_cents INTEGER NOT NULL
    );
    CREATE TABLE IF NOT EXISTS entry_items (
      id INTEGER PRIMARY KEY AUTOINCREMENT,
      entry_id INTEGER NOT NULL,
      section TEXT NOT NULL,
      label TEXT NOT NULL,
      cents INTEGER NOT NULL,
      count INTEGER NOT NULL
    );
  `;

  function base64ToUint8Array(base64) {
    const binaryStr = atob(base64);
    const bytes = new Uint8Array(binaryStr.length);
    for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);
    return bytes;
  }

  async function ensureSqlJs() {
    // Chrome blocks fetch()/XHR to file:// resources, which is how sql.js normally
    // loads its .wasm binary — so the wasm bytes are embedded as base64 (vendor/sql-wasm-binary.js,
    // loaded via a plain <script> tag) and handed to initSqlJs directly, skipping any network load.
    if (!SQL) {
      const wasmBinary = base64ToUint8Array(window.SQL_WASM_BASE64);
      SQL = await initSqlJs({ wasmBinary });
    }
    return SQL;
  }

  async function writeDbToFile() {
    if (!fileHandle || !db) return;
    const bytes = db.export();
    const writable = await fileHandle.createWritable();
    await writable.write(bytes);
    await writable.close();
  }

  async function connectHandle(handle) {
    // Request permission right after the user gesture (picker), before any
    // other await, so the browser doesn't treat it as stale/non-interactive.
    const permission = await handle.requestPermission({ mode: 'readwrite' });
    if (permission !== 'granted') {
      setDbStatus(false, null, 'Permission to read/write that file was denied.');
      return false;
    }

    await ensureSqlJs();

    fileHandle = handle;

    // Always load whatever is already in the file (regardless of which picker was
    // used to get here) so an existing database is never wiped — only an empty/new
    // file gets a fresh schema.
    const file = await handle.getFile();
    const buf = new Uint8Array(await file.arrayBuffer());
    db = buf.length > 0 ? new SQL.Database(buf) : new SQL.Database();
    db.run(SCHEMA);
    if (buf.length === 0) await writeDbToFile();

    await storeHandle(handle);
    setDbStatus(true, handle.name, 'This file will reconnect automatically next time.');
    renderHistory();
    return true;
  }

  function setDbStatus(connected, name, detail) {
    dbStatusEl.className = 'db-status ' + (connected ? 'connected' : 'disconnected');
    dbFileNameEl.textContent = connected ? name : 'not connected';
    dbStatusDetailEl.textContent = detail;
    saveBtn.disabled = !connected;
    dbConnectActionsEl.style.display = connected ? 'none' : 'flex';
  }

  async function tryReconnectOnLoad() {
    if (!fsApiSupported) {
      setDbStatus(false, null, 'Your browser doesn’t support saving to a local file. Use Chrome or Edge.');
      connectNewBtn.disabled = true;
      connectExistingBtn.disabled = true;
      return;
    }

    try {
      const stored = await loadStoredHandle();
      if (!stored) {
        setDbStatus(false, null, 'Connect a .sqlite file to save history to disk.');
        return;
      }
      const ok = await connectHandle(stored);
      if (!ok) return;
    } catch (e) {
      console.error('Reconnect failed:', e);
      setDbStatus(false, null, 'Could not reconnect automatically (' + e.message + ') — connect the file again.');
    }
  }

  // ---------- History rendering (reads from sql.js) ----------

  function renderHistory() {
    historyListEl.innerHTML = '';

    if (!db) {
      historyListEl.innerHTML = '<div class="empty-state">Connect a database file to see history.</div>';
      return;
    }

    const entries = db.exec('SELECT id, timestamp, total_cents FROM entries ORDER BY timestamp DESC');
    const rows = entries.length ? entries[0].values : [];

    if (rows.length === 0) {
      historyListEl.innerHTML = '<div class="empty-state">No saved counts yet.</div>';
      return;
    }

    rows.forEach(([id, timestamp, totalCents]) => {
      const itemsRes = db.exec(
        'SELECT section, label, cents, count FROM entry_items WHERE entry_id = ? ORDER BY id',
        [id]
      );
      const itemRows = itemsRes.length ? itemsRes[0].values : [];

      let breakdownHtml = '';
      let lastSection = null;
      itemRows.forEach(([section, label, cents, count]) => {
        if (section !== lastSection) {
          breakdownHtml += `<div class="breakdown-section-title">${section}</div>`;
          lastSection = section;
        }
        breakdownHtml += `<div class="breakdown-row"><span>${label} × ${count}</span><span>${formatCents(cents * count)}</span></div>`;
      });
      if (!breakdownHtml) breakdownHtml = '<div class="breakdown-row"><span>No items recorded</span></div>';

      const item = document.createElement('div');
      item.className = 'history-item';
      item.innerHTML = `
        <div class="history-head">
          <span class="history-time">${new Date(timestamp).toLocaleString()}</span>
          <span class="history-total">${formatCents(totalCents)}</span>
        </div>
        <div class="history-breakdown">${breakdownHtml}</div>
      `;

      historyListEl.appendChild(item);
    });
  }

  // ---------- Wiring ----------

  buildSections();
  buildSectionToggles();
  recompute();
  sectionsEl.addEventListener('input', recompute);
  sectionTogglesEl.addEventListener('change', applySectionVisibility);

  connectNewBtn.addEventListener('click', async () => {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: 'cash_counter.db',
        types: [{ description: 'SQLite Database', accept: { 'application/x-sqlite3': ['.db', '.sqlite'] } }],
      });
      await connectHandle(handle);
    } catch (e) {
      if (e.name !== 'AbortError') {
        console.error('Create database file failed:', e);
        setDbStatus(false, null, 'Could not create the database file (' + e.message + ').');
      }
    }
  });

  connectExistingBtn.addEventListener('click', async () => {
    try {
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: 'SQLite Database', accept: { 'application/x-sqlite3': ['.db', '.sqlite'] } }],
      });
      await connectHandle(handle);
    } catch (e) {
      if (e.name !== 'AbortError') {
        console.error('Open database file failed:', e);
        setDbStatus(false, null, 'Could not open that database file (' + e.message + ').');
      }
    }
  });

  saveBtn.addEventListener('click', async () => {
    const totalCents = recompute();
    const items = getEntryItems();
    if (totalCents === 0 || !db) return;

    const timestamp = Date.now();
    db.run('INSERT INTO entries (timestamp, total_cents) VALUES (?, ?)', [timestamp, totalCents]);
    const entryIdRes = db.exec('SELECT last_insert_rowid()');
    const entryId = entryIdRes[0].values[0][0];

    items.forEach((it) => {
      db.run(
        'INSERT INTO entry_items (entry_id, section, label, cents, count) VALUES (?, ?, ?, ?, ?)',
        [entryId, it.section, it.label, it.cents, it.count]
      );
    });

    await writeDbToFile();
    renderHistory();
  });

  document.getElementById('reset-btn').addEventListener('click', resetInputs);

  // ---------- Tabs ----------

  const tabButtons = { calculator: document.getElementById('tab-calculator-btn'), history: document.getElementById('tab-history-btn') };
  const tabPanels = { calculator: document.getElementById('calculator-panel'), history: document.getElementById('history-panel') };

  function showTab(name) {
    Object.keys(tabPanels).forEach((key) => {
      tabPanels[key].hidden = key !== name;
      tabButtons[key].classList.toggle('active', key === name);
    });
    if (name === 'history') renderHistory();
  }

  tabButtons.calculator.addEventListener('click', () => showTab('calculator'));
  tabButtons.history.addEventListener('click', () => showTab('history'));

  tryReconnectOnLoad();
</script>
</body>
</html>
